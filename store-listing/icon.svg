<svg width="1200" height="1200" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background (full-bleed; Shopify applies its own rounded mask) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E6BE6"/>
      <stop offset="1" stop-color="#1E4FB8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>

  <!-- Calendar body -->
  <g>
    <rect x="300" y="330" width="600" height="560" rx="56" fill="#FFFFFF"/>
    <!-- Header band -->
    <path d="M300 386 a56 56 0 0 1 56 -56 h488 a56 56 0 0 1 56 56 v78 h-600 z" fill="#12327A"/>
    <!-- Hangers -->
    <rect x="404" y="286" width="40" height="120" rx="20" fill="#0E2A66"/>
    <rect x="756" y="286" width="40" height="120" rx="20" fill="#0E2A66"/>
    <!-- Date grid dots -->
    <g fill="#C9D6F5">
      <circle cx="410" cy="560" r="26"/><circle cx="510" cy="560" r="26"/><circle cx="610" cy="560" r="26"/><circle cx="710" cy="560" r="26"/>
      <circle cx="410" cy="660" r="26"/><circle cx="510" cy="660" r="26"/><circle cx="610" cy="660" r="26"/><circle cx="710" cy="660" r="26"/>
      <circle cx="410" cy="760" r="26"/><circle cx="510" cy="760" r="26"/>
    </g>
  </g>

  <!-- Check badge (accuracy = the wedge) -->
  <g>
    <circle cx="792" cy="748" r="150" fill="#1FB56A" stroke="#FFFFFF" stroke-width="24"/>
    <path d="M722 752 l46 46 l96 -104" fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
